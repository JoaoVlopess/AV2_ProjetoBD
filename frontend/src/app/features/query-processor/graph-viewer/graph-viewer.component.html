<section class="panel">
  <h2>{{ title }}</h2>

  @if (graph) {
    <div
      #graphContainer
      class="graph-container"
      role="img"
      aria-label="Grafo do plano de álgebra relacional"
    ></div>

    <div class="legend" aria-label="Legenda do grafo">
      <span class="relation">Tabela</span>
      <span class="join">JOIN</span>
      <span class="selection">Seleção</span>
      <span class="projection">Projeção</span>
    </div>

    <p class="hint">
      As setas mostram o fluxo das tabelas até o resultado final. Use o mouse
      para mover e ampliar o grafo.
    </p>
  } @else {
    <p>O grafo será exibido quando a consulta for válida.</p>
  }
</section>
